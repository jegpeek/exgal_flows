[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exgal-flows"
version = "0.1.0"
description = "CO abundance vs. colliding flows and shear in resolved galaxy disks (M33)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "J. E. G. Peek" }]
keywords = ["astronomy", "ISM", "M33", "molecular gas", "kinematics"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "spectral-cube>=0.6",
    "reproject>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
exgal-flows = "exgal_flows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
